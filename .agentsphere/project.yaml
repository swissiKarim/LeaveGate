schemaVersion: 4
rationale: FastAPI LeaveGate app with SQLAlchemy models, auto-migration on startup,
  unified error JSON for 4xx/5xx; API and UI scenarios require the web service
components:
- name: app
  path: .
  toolchain:
    image: agentsphere/sandbox-polyglot
    kind: python
  verify:
  - ruff check .
  - pytest
  - pip install -q --break-system-packages -r requirements.txt
  - pytest --junitxml=.agentsphere/reports/junit.xml
  artifacts_ignore: []
  verifySlots:
    lint:
      command: ruff check .
      source: platform_default
    test:
      command: pytest
      source: platform_default
definition_of_done:
- ruff check . und pytest laufen ohne Fehler
- GET /health antwortet auf Port 8080 (Dienst web)
- Alle 4xx/5xx-Antworten liefern einheitliches Fehler-JSON
- Employee UI-Seiten unter /employees, /employees/new, /employees/{id}, /employees/{id}/edit
network:
  needs: []
services:
- name: web
  start: pip install -q --break-system-packages -r requirements.txt && uvicorn app.main:app
    --host 0.0.0.0 --port 8080
  port: 8080
  health:
    http: /health
    timeoutSec: 60
  preview:
    path: /
