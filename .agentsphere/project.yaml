schemaVersion: 4
rationale: FastAPI skeleton for LeaveGate; API scenarios require the web service;
  pytest covers AC-3
components:
- name: app
  path: .
  toolchain:
    image: agentsphere/sandbox-polyglot
    kind: python
  verify:
  - ruff check .
  - pytest
  - pytest --junitxml=.agentsphere/reports/junit.xml
  artifacts_ignore: []
  verifySlots:
    lint:
      command: ruff check .
      source: platform_default
    test:
      command: pytest
      source: platform_default
definition_of_done:
- ruff check . und pytest laufen ohne Fehler
- GET /health antwortet auf Port 8080 (Dienst web)
network:
  needs: []
services:
- name: web
  start: uvicorn app.main:app --host 0.0.0.0 --port 8080
  port: 8080
  health:
    http: /health
    timeoutSec: 30
  preview:
    path: /
